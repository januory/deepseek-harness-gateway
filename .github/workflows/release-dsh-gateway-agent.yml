# 手动发布 dsh-gateway-agent 插件到 npm（发布包名 @januory/dsh-gateway-agent）。
#
# 仅 npm 发布，不打 git tag、不建 GitHub Release。
#   1. 安装依赖（ws）
#   2. 跑单元测试（plain JS，框架无关）
#   3. npm publish（provenance，scope 包默认私有，需 --access public）
#
# 前提：仓库 Secrets 中配置 NPM_TOKEN（npm automation token 或带 publish 权限的 granular token）。

name: release-dsh-gateway-agent

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm publish provenance（npmjs 公开包）

concurrency:
  group: npm-release-dsh-gateway-agent
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/dsh-gateway-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
